<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Text Frame</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #333; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
  #frame {
    width: 1080px; height: 1350px; position: relative; overflow: hidden;
    background:
      radial-gradient(1200px 900px at 85% -10%, rgba(255,255,255,0.14), transparent 60%),
      radial-gradient(1400px 1100px at 10% 110%, rgba(0,0,0,0.28), transparent 60%),
      linear-gradient(165deg, #ef3b3b 0%, #dc2626 45%, #b91c1c 100%);
  }
  .chip {
    position: absolute; top: 160px; left: 50%; transform: translateX(-50%);
    display: flex; align-items: center; gap: 18px;
    background: rgba(255,255,255,0.14); border: 2px solid rgba(255,255,255,0.35);
    border-radius: 999px; padding: 16px 40px;
    color: #fff; font-size: 32px; font-weight: 600; letter-spacing: 0.02em;
    backdrop-filter: blur(4px); white-space: nowrap;
  }
  .headline {
    position: absolute; top: 258px; left: 84px; right: 84px;
    color: #fff; font-size: 84px; line-height: 1.02; font-weight: 900;
    letter-spacing: -0.02em; text-transform: uppercase;
    text-shadow: 0 4px 24px rgba(0,0,0,0.18);
  }
  .headline em { font-style: normal; color: #ffe4e6; }
  .phone {
    position: absolute; left: 50%; transform: translateX(-50%); top: 640px; width: 820px;
    background: #000; border-radius: 40px; padding: 44px 40px 52px;
    box-shadow: 0 30px 60px rgba(0,0,0,0.4);
  }
  .phone .contact { display: flex; flex-direction: column; align-items: center; gap: 14px; margin-bottom: 40px; }
  .phone .avatar { width: 96px; height: 96px; border-radius: 50%; object-fit: cover; }
  .phone .name {
    background: #2c2c2e; color: #fff; font-size: 28px; font-weight: 600;
    border-radius: 999px; padding: 10px 34px;
  }
  .phone .bubble {
    background: #3a3a3c; color: #fff; font-size: 34px; line-height: 1.4;
    border-radius: 36px; border-bottom-left-radius: 10px;
    padding: 28px 34px; max-width: 640px;
  }
  .cta { position: absolute; bottom: 132px; left: 84px; right: 84px; text-align: center; }
  .cta .offer {
    display: inline-block; background: #fff; color: #b91c1c;
    font-size: 40px; font-weight: 900; letter-spacing: 0.01em;
    border-radius: 999px; padding: 24px 52px;
    box-shadow: 0 18px 40px rgba(0,0,0,0.28);
  }
  .cta .offer .code { letter-spacing: 0.08em; }
  .cta .sub { margin-top: 18px; color: #ffe4e6; font-size: 27px; font-weight: 600; letter-spacing: 0.02em; }
</style>
</head>
<body>
<div id="frame">
  <div class="chip"></div>
  <div class="headline"></div>
  <div class="phone">
    <div class="contact">
      <img class="avatar" src="" alt="" />
      <div class="name"></div>
    </div>
    <div class="bubble"></div>
  </div>
  <div class="cta">
    <div class="offer">50% off · code <span class="code">FIFAFAN50</span></div>
    <div class="sub">Up to $100 off at Airbnb checkout · Book by July 21</div>
  </div>
</div>
<script>
  async function main() {
    const params = new URLSearchParams(location.search)
    const texts = await (await fetch('content/texts.json')).json()
    const t = texts[params.get('t') ?? Object.keys(texts)[0]]
    document.querySelector('.chip').textContent = t.chip
    document.querySelector('.headline').innerHTML = t.headline
    document.querySelector('.avatar').src = `content/${t.avatar}`
    document.querySelector('.name').textContent = t.name
    document.querySelector('.bubble').textContent = t.message
    if (params.get('promo') === '0') {
      document.querySelector('.cta').innerHTML = `
        <div class="offer">Book on Airbnb · link in bio</div>
        <div class="sub">In-home massage, anywhere in LA · Table or chair</div>`
    }
    document.title = 'ready-text'
  }
  main()
</script>
</body>
</html>
